  <rect x="33" y="32" width="7" height="34" rx="2" fill="#FFFFFF" />

  <!-- Letter B (Curves and Crossbars) -->
  <path d="M46 32 H60 C64.5 32 67.5 34.5 67.5 38.5 C67.5 41.5 65.5 43.5 62.5 44.5 C66.5 45.5 68.5 48 68.5 52 C68.5 56.5 65 59.5 60 59.5 H46 V32 Z M53 38 V43 H59 C61 43 62 42 62 40.5 C62 39 61 38 59 38 H53 Z M53 48.5 V54 H60 C62 54 63 53 63 51.3 C63 49.5 62 48.5 60 48.5 H53 Z" 
        fill="#FFFFFF" />

  <!-- Intelligence Node Spark / Compass Accent in --bis-red -->
