<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bisNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35569E" />
      <stop offset="100%" stop-color="#263F73" />
    </linearGradient>
    <linearGradient id="bisRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#A42115" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B122C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <path d="M50 6 L86 22 V50 C86 72 50 92 50 92 C50 92 14 72 14 50 V22 Z" 
