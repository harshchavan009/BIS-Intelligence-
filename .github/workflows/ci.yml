name: BIS AI Assistant CI & Security Baseline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-security-and-tests:
    name: Backend Audit & Verification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit pytest

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc on || echo "pip-audit completed with security advisory warnings."

      - name: Run Backend Unit & Verification Tests
        run: |
          python -m unittest backend/tests/test_backend.py

  frontend-audit-and-build:
    name: Frontend Audit & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Dependency Security Audit (npm audit)
        working-directory: ./frontend
        run: npm audit --audit-level=high || echo "npm audit advisory logged"

      - name: Build Production Frontend Assets
        working-directory: ./frontend
        run: npm run build
