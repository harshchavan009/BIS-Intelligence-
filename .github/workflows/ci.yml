name: BIS AI Assistant CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-eval-tests:
    name: Backend Evaluation & Grounding Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install rank-bm25

      - name: Verify Canonical Datasets Integrity
        run: |
          python3 -c "
          import json, csv
          with open('data/knowledge_base_seed.json') as f:
              raw = f.read()
              assert 'NOT CAPTURED' not in raw, 'Dataset contains NOT CAPTURED placeholders'
              assert 'null' not in raw, 'Dataset contains nulls'
          with open('data/standards_master.csv') as f:
              rows = list(csv.DictReader(f))
              assert len(rows) >= 40, f'Expected at least 40 standards, got {len(rows)}'
          print(f'Canonical datasets validated successfully: {len(rows)} standards, zero nulls.')
          "

      - name: Run 65-Case Groundedness Evaluation
        run: |
          python3 scripts/run_eval.py

  frontend-quality:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Compile & Bundle Check
        working-directory: frontend
        run: npm run build
