services:
  - type: web
    name: bis-ai-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: offline
      - key: APP_MODE
        value: demo
      - key: EMBEDDING_MODE
        value: lightweight
      - key: DATABASE_URL
        value: sqlite:///./data/bis_assistant.db
